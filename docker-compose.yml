version: '3.8'

services:
  vibevoice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibevoice-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=vibevoice/VibeVoice-1.5B
      - PYTHONUNBUFFERED=1
    volumes:
      - model-cache:/root/.cache/huggingface
      - ./outputs:/app/outputs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  model-cache:
    driver: local
