version: '3.8'

services:
  vibevoice-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibevoice-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=vibevoice/VibeVoice-1.5B
      - PYTHONUNBUFFERED=1
      - FORCE_CPU=true
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
    volumes:
      - model-cache:/root/.cache/huggingface
      - ./outputs:/app/outputs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 20G
        reservations:
          memory: 8G
    shm_size: '2gb'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  model-cache:
    driver: local
